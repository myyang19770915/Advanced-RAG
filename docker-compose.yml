version: "3.9"

services:
  qdrant:
    image: qdrant/qdrant:v1.13.6
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - ./data/qdrant:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/6333 && echo OK' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      qdrant:
        condition: service_healthy
    # Load user-configurable settings from root .env
    # Docker-internal settings below override any matching keys in env_file
    env_file:
      - .env
    environment:
      APP_ENV: prod
      DATABASE_URL: sqlite+aiosqlite:////app/data/app.db
      VECTOR_STORE: qdrant
      QDRANT_URL: http://qdrant:6333
      DATA_DIR: /app/data
      CORS_ORIGINS: "http://localhost,http://localhost:80,http://127.0.0.1"
    volumes:
      - ./backend/data:/app/data
      - fastembed_cache:/root/.cache/fastembed
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"

volumes:
  fastembed_cache:
