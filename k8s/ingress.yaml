# ==============================================================================
# Ingress（推薦方案，需安裝 nginx-ingress-controller）
# 安裝 ingress controller：
#   kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.10.0/deploy/static/provider/cloud/deploy.yaml
#
# 使用此 Ingress 時，frontend-service 改為 type: ClusterIP
# ==============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: advanced-rag-ingress
  namespace: advanced-rag
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"       # SSE 串流需要
    nginx.ingress.kubernetes.io/proxy-cache: "off"           # SSE 串流需要
    # nginx.ingress.kubernetes.io/ssl-redirect: "true"       # 啟用 HTTPS 時打開
spec:
  ingressClassName: nginx
  rules:
    - host: advanced-rag.example.com  # 替換成你的 domain 或 IP
      http:
        paths:
          - path: /api/
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80
  # TLS（搭配 cert-manager 自動申請憑證）
  # tls:
  #   - hosts:
  #       - advanced-rag.example.com
  #     secretName: advanced-rag-tls
