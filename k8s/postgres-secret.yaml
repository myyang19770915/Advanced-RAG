# ==============================================================================
# PostgreSQL Secret（密碼）+ ConfigMap（連線設定）
# 使用方式（推薦用 kubectl 直接建立，避免明文進 git）：
#   kubectl create secret generic postgres-secret -n advanced-rag \
#     --from-literal=POSTGRES_PASSWORD=your-strong-password \
#     --from-literal=DATABASE_URL="postgresql+asyncpg://raguser:your-strong-password@postgres-service:5432/ragdb"
# ==============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: advanced-rag
type: Opaque
stringData:
  POSTGRES_PASSWORD: "ragpass"   # 正式環境請換強密碼
  DATABASE_URL: "postgresql+asyncpg://raguser:ragpass@postgres-service:5432/ragdb"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  namespace: advanced-rag
data:
  POSTGRES_DB: "ragdb"
  POSTGRES_USER: "raguser"
