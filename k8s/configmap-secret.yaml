# ==============================================================================
# Secret：敏感資訊（API keys）
# 使用方式：
#   先 base64 encode 你的值：  echo -n "your-value" | base64
#   或用 kubectl 直接建立：
#   kubectl create secret generic rag-secrets -n advanced-rag \
#     --from-literal=LLM_API_KEY=your-key \
#     --from-literal=RERANK_API_KEY=your-key \
#     --from-literal=EMBEDDING_API_KEY=your-key
# ==============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: rag-secrets
  namespace: advanced-rag
type: Opaque
stringData:
  LLM_API_KEY: "changeme"
  RERANK_API_KEY: "changeme"
  EMBEDDING_API_KEY: "changeme"
---
# ==============================================================================
# ConfigMap：非敏感設定（對應 docker-compose 的 environment 區塊）
# ==============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: rag-config
  namespace: advanced-rag
data:
  APP_ENV: "prod"
  DATABASE_URL: "sqlite+aiosqlite:////app/data/app.db"
  VECTOR_STORE: "qdrant"
  QDRANT_URL: "http://qdrant-service:6333"
  DATA_DIR: "/app/data"
  CORS_ORIGINS: "http://localhost,http://localhost:80"
  # LLM 設定（非 key 的部分）
  LLM_PROVIDER: "openai"
  LLM_BASE_URL: "http://192.168.68.111:1234/v1"
  LLM_MODEL: "qwen35-27b"
  EMBEDDING_PROVIDER: "openai"
  EMBEDDING_BASE_URL: "http://192.168.68.111:1234/v1"
  EMBEDDING_MODEL: "text-embedding-qwen3-embedding-0.6b"
  EMBEDDING_DIM: "1024"
  RERANK_ENABLED: "true"
  RERANK_PROVIDER: "cohere"
  RERANK_MODEL: "rerank-v4.0-fast"
